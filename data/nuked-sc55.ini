; Nuked-SC55 headless (MiSTer) config: /media/fat/linux/nuked-sc55.ini
; Command line options override these values.

; Directory holding the ROM files
rom_dir = /media/fat/nuked-sc55

; auto, mk2, st, mk1, cm300, jv880, scb55, rlp3237, sc155, sc155mk2
romset = auto

; ALSA output device (e.g. default, hw:0,0, plughw:0,0)
audio_device = default

; <page_size>:<page_count>, total ring = page_size * page_count samples
audio_buffer = 512:32

; ALSA sequencer input port index
midi_port = 0

; Reset on startup: none, gs, gm
reset = none
